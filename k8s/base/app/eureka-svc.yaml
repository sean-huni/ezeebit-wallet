apiVersion: v1
kind: Service
metadata:
  name: eureka-svc
  labels:
    app.kubernetes.io/name: eureka-svc
    ezeebit.io/stage: app
spec:
  selector:
    app.kubernetes.io/name: eureka-svc
  ports:
    - {name: http, port: 8761, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-svc
  labels:
    app.kubernetes.io/name: eureka-svc
    ezeebit.io/stage: app
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels:
      app.kubernetes.io/name: eureka-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eureka-svc
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: eureka-svc
          image: 'ezeebit/eureka-svc:0.2.0'
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8761}
          env:
            - {name: SERVER_ADDRESS, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: HOSTNAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: OTLP_URL, value: 'http://lgtm.ezeebit-obs:4318'}
            # The peer list defaults to localhost:8761, which nothing answers on a pod-IP bind: name this server's own address.
            # JSON, not EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: an environment key binds as defaultzone, which Eureka never reads.
            - name: SPRING_APPLICATION_JSON
              value: '{"eureka":{"client":{"service-url":{"defaultZone":"http://$(SERVER_ADDRESS):8761/eureka/"}}}}'
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          lifecycle:
            # Eureka expiry (15s) plus a client fetch (5s) is when callers stop choosing this pod; until then it keeps
            # serving, and graceful shutdown (20s) then drains what is in flight.
            preStop: {sleep: {seconds: 15}}
