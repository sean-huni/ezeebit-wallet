apiVersion: v1
kind: Service
metadata:
  name: gateway-svc
  labels:
    app.kubernetes.io/name: gateway-svc
    ezeebit.io/stage: app
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway-svc
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-svc
  labels:
    app.kubernetes.io/name: gateway-svc
    ezeebit.io/stage: app
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-svc
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: gateway-svc
          image: 'ezeebit/gateway-svc:0.2.0'
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SERVER_ADDRESS, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: HOSTNAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: OTLP_URL, value: 'http://lgtm.ezeebit-obs:4318'}
            - {name: CONFIG_SERVER_URL, value: 'http://config-svc.ezeebit-app:8888'}
            - {name: EUREKA_URL, value: 'http://eureka-svc.ezeebit-app:8761/eureka/'}
            - {name: REDIS_HOST, value: redis.ezeebit-data}
            - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: redis, key: REDIS_PASSWORD}}}
            - {name: GATEWAY_SHARED_SECRET, valueFrom: {secretKeyRef: {name: gateway-proof, key: GATEWAY_SHARED_SECRET}}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          lifecycle:
            # Endpoint removal reaches kube-proxy within these 5s. Then DeregisterBeforeDrain sets the instance DOWN in
            # Eureka and serves 10s while callers drop it, and graceful shutdown (20s) drains: 35s inside the 40s grace.
            preStop: {sleep: {seconds: 5}}
