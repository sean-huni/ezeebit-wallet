springBootVersion=4.1.1
dependencyManagementVersion=1.1.7
# 2025.1.x supports Boot >=4.0.0 and <4.2.0-M1: a Boot 4.2 bump needs a new train.
springCloudVersion=2025.1.3
# Must match the opentelemetry-api of Boot's managed opentelemetry.version (1.62.0 in Boot 4.1.1).
otelLogbackAppenderVersion=2.28.1-alpha
# Latest release on Maven Central (io.cucumber:cucumber-bom maven-metadata.xml), checked 2026-10-13.
cucumberVersion=8.0.4
# Latest stable on Maven Central (org.wiremock:wiremock-standalone; 4.x is still beta), checked 2026-10-13.
wiremockVersion=3.13.2
# Quality tools: latest releases on Maven Central and the Gradle plugin portal (maven-metadata.xml), checked 2026-10-13.
spotbugsPluginVersion=6.5.13
# The analyser is pinned apart from the plugin: Java 25 bytecode (class file 69) needs the 4.10 line.
spotbugsVersion=4.10.5
findsecbugsVersion=1.14.0
checkstyleVersion=14.3.0
jacocoVersion=0.8.15
sonarPluginVersion=7.5.0.8588
# Paketo builder and the run image it names, pinned by tag@index-digest; bootBuildImage reads both.
# Newest builder tag at least two weeks old; digests from the Docker Hub tag API and
# `docker buildx imagetools inspect`, which agree, checked 2026-10-16. Both are amd64+arm64 indexes.
paketoBuilder=paketobuildpacks/builder-noble-java-tiny:0.0.197@sha256:b95da27fce97b58037f0c11ae934760c50730da4c9a24976205b53638592eba9
paketoRunImage=paketobuildpacks/ubuntu-noble-run-tiny:0.0.138@sha256:b1a26d91357134faa5a7f118f4e68a8c4c3278230660e8a49c924e92af6a905a
# Patch overrides of Boot 4.1.1-managed versions, applied in the root build.gradle; drop each when Boot manages it.
# Newest at least two weeks old on Maven Central metadata, checked 2026-10-13.
# Tomcat 11.0.24 -> CVE-2026-65182, CVE-2026-65905, CVE-2026-68525 (fixed in 11.0.25).
tomcatVersion=11.0.26
# tools.jackson 3.1.5 -> CVE-2026-68497, CVE-2026-89407, CVE-2026-89425, CVE-2026-91776, CVE-2026-91777.
jackson3Version=3.1.7
# com.fasterxml.jackson 2.21.5 -> the same five CVEs on the Jackson 2 line.
jackson2Version=2.21.7
# FreeMarker 2.3.34 (Eureka dashboard templates) -> CVE-2026-84939.
freemarkerVersion=2.3.35
# Bucket4j's Lettuce backend for the gateway rate limiter: newest release at least two weeks old on Maven Central
# (8.20.0, 2026-09-17; 8.21.0 is 2026-10-02), checked 2026-10-13. It declares lettuce-core provided, so Boot manages that.
bucket4jVersion=8.20.0
# The one home of the Redis pin: compose.yaml must carry the same string (RedisPinTest) and Testcontainers reads it.
# Tag and index digest from the Docker Hub tag API and `docker buildx imagetools inspect`, which agree, checked 2026-10-16.
redisImage=redis:8.10.2-alpine3.23@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
# springdoc-openapi: newest release at least two weeks old on Maven Central (3.1.1, 2026-09-06), checked 2026-10-13.
# Its parent POM is spring-boot-starter-parent 4.1.0, the 3.x line being the one built for Boot 4.
springdocVersion=3.1.1
# lz4-java, pulled by kafka-clients 4.2.1 at 1.10.1 -> CVE-2026-106451 (HIGH, code execution via insecure temp
# files). 1.11.4 is the advisory's fixed version (Maven Central, 2026-09-25); 1.12.0 is a new minor line Kafka 4.2 does not name.
lz4JavaVersion=1.11.4
# Gradle protobuf plugin: latest release on the plugin portal (com.google.protobuf maven-metadata.xml), checked 2026-10-14.
protobufPluginVersion=0.10.0
# protoc matches Boot 4.1.1's managed protobuf-java.version; grpc matches its grpc-java.version (spring-boot-dependencies-4.1.1.pom), checked 2026-10-14.
protocVersion=4.35.1
grpcVersion=1.83.1
# Resilience4j: latest release on Maven Central (resilience4j-spring-boot4 maven-metadata.xml, 2.4.0), checked 2026-10-14.
resilience4jVersion=2.4.0
# The one home of the Kafka pin: compose.yaml carries the same string (KafkaPinTest) and Testcontainers reads it.
# 4.3.1 is the latest stable tag on Docker Hub (also `latest`; newer tags are -rc), amd64+arm64, checked 2026-10-14.
# Index digest from the Docker Hub tag API and `docker buildx imagetools inspect`, which agree. Base OS: Alpine 3.23.4
# (/etc/os-release), so no separate -alpine tag is needed; the tag API lists none.
kafkaImage=apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
