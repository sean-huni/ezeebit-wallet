# GENERATED by docker/lgtm/generate.py, do not edit: change the generator and rerun it.
apiVersion: 1
groups:
  - orgId: 1
    name: ezeebit
    folder: Ezeebit alerts
    interval: 10s
    rules:
      - uid: ezeebit-service-down
        title: ServiceDown
        condition: B
        # 30s = 3 export steps. One term per service, so each down service is its own alert;
        # a fleet that never booted pages too. absent() would wait out the 5m lookback.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              refId: A
              instant: true
              expr: >-
                absent_over_time(jvm_threads_live{job="config-svc"}[30s])
                or absent_over_time(jvm_threads_live{job="eureka-svc"}[30s])
                or absent_over_time(jvm_threads_live{job="ledger-svc"}[30s])
                or absent_over_time(jvm_threads_live{job="conversion-svc"}[30s])
                or absent_over_time(jvm_threads_live{job="gateway-svc"}[30s])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # Every service exporting returns no series: that is the healthy state.
        noDataState: OK
        execErrState: Error
        # Longer than a fleet boot (about 30s from Grafana ready to the last first sample).
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.job }} has exported no metrics for 30s'
          runbook: 'Run ./fleet.sh status; read .fleet/{{ $labels.job }}.log for the exit; restart with ./fleet.sh down && ./fleet.sh up.'
          __dashboardUid__: ezeebit-alerts
          __panelId__: '4'
      - uid: ezeebit-high-error-rate
        title: HighErrorRate
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              instant: true
              expr: >-
                sum by (job) (rate(http_server_requests_milliseconds_count{status=~"5.."}[1m]))
                / sum by (job) (rate(http_server_requests_milliseconds_count[1m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.05]}
        # No 5xx anywhere returns no series.
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} answers more than 5% of requests with 5xx'
          runbook: 'Open Logs filtered to {{ $labels.job }} at level error; a 503 from the gateway names the upstream that is down.'
          __dashboardUid__: ezeebit-alerts
          __panelId__: '5'
      - uid: ezeebit-rate-feed-refusing
        title: RateFeedRefusing
        condition: B
        # A is the pair's rate refusals in the last minute when either arm holds, else 0: more than 2 refusals,
        # or at least 1 that is half or more of the pair's quotes, so a quiet pair refused every time pages too.
        # Each count: a series first created inside the window has nothing for increase() to start from, so it
        # counts whole (unless); a restarted JVM's drop is clamped to 0.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              instant: true
              expr: >-
                (sum by (pair) (clamp_min(ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} - ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} offset 1m, 0) or (ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} unless ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} offset 1m)))
                * clamp_max(
                    ((sum by (pair) (clamp_min(ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} - ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} offset 1m, 0) or (ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} unless ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} offset 1m))) > bool 2)
                    + (((sum by (pair) (clamp_min(ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} - ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} offset 1m, 0) or (ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} unless ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} offset 1m))) >= bool 1)
                      * (((sum by (pair) (clamp_min(ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} - ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} offset 1m, 0) or (ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} unless ezeebit_conversion_quotes_total{outcome="refused", reason=~"RATE_UNAVAILABLE|RATE_REJECTED"} offset 1m))) / (sum by (pair) (clamp_min(ezeebit_conversion_quotes_total - ezeebit_conversion_quotes_total offset 1m, 0) or (ezeebit_conversion_quotes_total unless ezeebit_conversion_quotes_total offset 1m)))) >= bool 0.5)),
                    1)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # No rate refusal since the services started returns no series: nothing to report. A silent
        # conversion-svc is ServiceDown's to page, not this rule's.
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'conversion-svc refused quotes for {{ $labels.pair }} for the rate (unavailable or rejected) {{ $values.A.Value }} times in the last minute: more than 2, or half or more of its quotes'
          runbook: 'Open Money, Quote refusals by reason: RATE_UNAVAILABLE means the feed does not answer (curl localhost:8089/rates), RATE_REJECTED names the rule (stale, out of band, jump).'
          __dashboardUid__: ezeebit-alerts
          __panelId__: '6'
      - uid: ezeebit-conversions-stuck-pending
        title: ConversionsStuckPending
        condition: B
        # Read from the database by every replica, so all report the same count: max, never sum.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              refId: A
              instant: true
              expr: >-
                max(ezeebit_conversion_pending_overdue)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # No conversion-svc exporting returns no series; ServiceDown pages for that.
        noDataState: OK
        execErrState: Error
        # One sweep runs every 10s, so a due row normally lives for seconds; 5m means it cannot be resolved.
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'conversion-svc: {{ $values.A.Value }} PENDING conversions are past their deadline and the sweeper has not resolved them for 5m'
          runbook: 'The sweeper asks ledger-svc every 10s: check ledger-svc is up and answering, then Traces for span ''sweep''.'
          __dashboardUid__: ezeebit-alerts
          __panelId__: '7'
      - uid: ezeebit-rate-limiter-unavailable
        title: RateLimiterUnavailable
        condition: B
        # The gateway refuses merchant requests with 503 while Redis does not answer (fail closed), so any
        # unavailable outcome is an edge outage. Every outcome is registered at zero when the gateway starts,
        # so increase() always has a series to start from.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              instant: true
              expr: >-
                sum(increase(ezeebit_gateway_ratelimit_total{outcome="unavailable"}[1m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # No gateway exporting returns no series; ServiceDown pages for that.
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'gateway-svc refused {{ $values.A.Value }} merchant requests in the last minute because Redis did not answer'
          runbook: 'docker compose ps redis; the limiter fails closed, so every merchant call is 503 until Redis answers.'
          __dashboardUid__: ezeebit-alerts
          __panelId__: '8'
      - uid: ezeebit-rate-limiter-store-down
        title: RateLimiterStoreDown
        condition: B
        # 1 when any gateway's PING to Redis fails (min across replicas of the 1/0 gauge), or when no gateway has
        # published it for 30s (3 export steps). last_over_time, not a bare selector: a pushed gauge has no staleness
        # marker, so min() alone read a dead gateway's last 1 for the 5m lookback (measured). Needs no traffic.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              refId: A
              instant: true
              expr: >-
                (1 - min(last_over_time(ezeebit_gateway_ratelimit_store_up[30s])))
                or absent_over_time(ezeebit_gateway_ratelimit_store_up[30s])
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'gateway-svc cannot reach Redis, or no gateway reports it: merchant requests are refused with 503'
          runbook: 'docker compose ps redis and docker compose logs redis; then the gateway''s own log for the PING errors.'
          __dashboardUid__: ezeebit-alerts
          __panelId__: '9'
      - uid: ezeebit-latency-slo-burn
        title: LatencySLOBurn
        condition: B
        # SLO: 99% of business requests answered within 500 ms, so the error budget is 1%. Fires when the slow
        # share burns that budget 14.4 times too fast over both 5m and 1h (the fast-burn pair of the multiwindow
        # method), and only while a service sees at least 3 requests a minute, so one slow call on an idle
        # service is not a page. le="500.0" is the SLO bucket the shared config adds to http.server.requests.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: >-
                ((1 - sum by (job) (rate(http_server_requests_milliseconds_bucket{le="500.0", uri!~"/actuator.*"}[5m])) / sum by (job) (rate(http_server_requests_milliseconds_count{uri!~"/actuator.*"}[5m]))) / 0.01 > 14.4)
                and ((1 - sum by (job) (rate(http_server_requests_milliseconds_bucket{le="500.0", uri!~"/actuator.*"}[1h])) / sum by (job) (rate(http_server_requests_milliseconds_count{uri!~"/actuator.*"}[1h]))) / 0.01 > 14.4)
                and sum by (job) (rate(http_server_requests_milliseconds_count{uri!~"/actuator.*"}[5m])) > 0.05
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # A service with no slow requests returns no series.
        noDataState: OK
        execErrState: Error
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} is burning its latency budget (99% under 500 ms) 14.4x too fast over 5m and 1h'
          runbook: 'Open Fleet Overview, p95 by endpoint for {{ $labels.job }}, and click an exemplar to open the slowest trace.'
          __dashboardUid__: ezeebit-alerts
          __panelId__: '10'
      - uid: ezeebit-db-pool-saturated
        title: DbPoolSaturated
        condition: B
        # A thread waiting for a Hikari connection means every connection is in use: the next request queues
        # behind the pool, and after connectionTimeout (30s) it fails. Per JVM, so one saturated replica pages.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              refId: A
              instant: true
              expr: >-
                max by (job, instance) (max_over_time(hikaricp_connections_pending[30s]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # A service with no pool (gateway, config, eureka) returns no series.
        noDataState: OK
        execErrState: Error
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.job }} ({{ $labels.instance }}) has threads waiting for a database connection'
          runbook: 'Fleet Overview, Database pool row: active at max means slow queries or a held transaction; check Postgres.'
          __dashboardUid__: ezeebit-alerts
          __panelId__: '11'
      - uid: ezeebit-ledger-invariant-broken
        title: LedgerInvariantBroken
        condition: B
        # The ledger refused its own posting as unbalanced or mixing currencies: a code defect, never bad input
        # (ErrorStatus maps both codes to 500). Any one in the last 5m pages at once. Each count includes a
        # series born inside the window, which is the usual case: the counter exists only after the first one.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 360, to: 0}
            model:
              refId: A
              instant: true
              expr: >-
                sum by (job, code) (
                  (clamp_min(ezeebit_ledger_deposits_total{outcome="refused", code=~"CURRENCY_MISMATCH|UNBALANCED_POSTING"} - ezeebit_ledger_deposits_total{outcome="refused", code=~"CURRENCY_MISMATCH|UNBALANCED_POSTING"} offset 5m, 0) or (ezeebit_ledger_deposits_total{outcome="refused", code=~"CURRENCY_MISMATCH|UNBALANCED_POSTING"} unless ezeebit_ledger_deposits_total{outcome="refused", code=~"CURRENCY_MISMATCH|UNBALANCED_POSTING"} offset 5m))
                  or (clamp_min(ezeebit_ledger_conversion_postings_total{outcome="refused", code=~"CURRENCY_MISMATCH|UNBALANCED_POSTING"} - ezeebit_ledger_conversion_postings_total{outcome="refused", code=~"CURRENCY_MISMATCH|UNBALANCED_POSTING"} offset 5m, 0) or (ezeebit_ledger_conversion_postings_total{outcome="refused", code=~"CURRENCY_MISMATCH|UNBALANCED_POSTING"} unless ezeebit_ledger_conversion_postings_total{outcome="refused", code=~"CURRENCY_MISMATCH|UNBALANCED_POSTING"} offset 5m))
                )
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # No invariant break since the ledger started returns no series.
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: 'ledger-svc broke a posting invariant ({{ $labels.code }}) {{ $values.A.Value }} times in the last 5m'
          runbook: 'Logs for ledger-svc, search ''ledger invariant violated'': the trace_id opens the request that broke it. Stop postings until fixed.'
          __dashboardUid__: ezeebit-alerts
          __panelId__: '12'
      - uid: ezeebit-conversion-ledger-dead-lettered
        title: ConversionLedgerDeadLettered
        condition: B
        # conversion-svc gave up on a ledger call after its retries or an open breaker and recorded a dead letter.
        # Counted before the send, so this pages whether or not Kafka took it. The counter is born with the first
        # dead letter, so each count includes a series born inside the window, which increase() cannot see.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 360, to: 0}
            model:
              refId: A
              instant: true
              expr: >-
                sum by (op, reason) (clamp_min(ezeebit_conversion_ledger_deadletter_total{job="conversion-svc"} - ezeebit_conversion_ledger_deadletter_total{job="conversion-svc"} offset 5m, 0) or (ezeebit_conversion_ledger_deadletter_total{job="conversion-svc"} unless ezeebit_conversion_ledger_deadletter_total{job="conversion-svc"} offset 5m))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # No dead letter since conversion-svc started returns no series: nothing to report.
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.op }} to the ledger was dead-lettered ({{ $labels.reason }})'
          runbook: 'Read the topic: docker compose exec kafka /opt/kafka/bin/kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic ezeebit.conversion.ledger.deadletter --from-beginning. The sweeper settles the conversion once the ledger answers; check ledger-svc with ./fleet.sh status.'
          __dashboardUid__: ezeebit-alerts
          __panelId__: '13'
      - uid: ezeebit-dead-letter-publish-failing
        title: DeadLetterPublishFailing
        condition: B
        # A dead letter that Kafka did not take: the record of a ledger call conversion-svc gave up on exists only
        # in its log. Born with the first failure, so counted with the series-born arm.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 360, to: 0}
            model:
              refId: A
              instant: true
              expr: >-
                sum by (op) (clamp_min(ezeebit_conversion_ledger_deadletter_publish_failed_total{job="conversion-svc"} - ezeebit_conversion_ledger_deadletter_publish_failed_total{job="conversion-svc"} offset 5m, 0) or (ezeebit_conversion_ledger_deadletter_publish_failed_total{job="conversion-svc"} unless ezeebit_conversion_ledger_deadletter_publish_failed_total{job="conversion-svc"} offset 5m))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # No failed publish since conversion-svc started returns no series: nothing to report.
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: 'conversion-svc could not publish a {{ $labels.op }} dead letter to Kafka: it is only in the log'
          runbook: 'docker compose ps kafka; then .fleet/conversion-svc.log, search ''dead letter not published'' for the conversion ids and the cause.'
          __dashboardUid__: ezeebit-alerts
          __panelId__: '14'
      - uid: ezeebit-kafka-absent
        title: KafkaAbsent
        condition: B
        # Spring creates the producer at the first dead letter, so before one there is no series: absent_over_time()
        # would page every healthy fleet that never dead-lettered, and a first send that cannot reach Kafka is
        # DeadLetterPublishFailing's. Measured: 0 within 10s of the broker stopping; idle for 17m it held 1 connection
        # (the 5m metadata refresh), so an idle producer does not page. last_over_time: a pushed gauge has no
        # staleness marker.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              refId: A
              instant: true
              expr: >-
                max by (job) (last_over_time(kafka_producer_connection_count{job="conversion-svc"}[30s])) == bool 0
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
        # No producer yet (no dead letter since conversion-svc started) returns no series: OK, see above.
        noDataState: OK
        execErrState: Error
        # The producer reconnects within seconds of a broker restart (measured); 60s is a broker that stays away.
        for: 60s
        labels:
          severity: critical
        annotations:
          summary: 'conversion-svc''s Kafka producer has had no broker connection for 60s: dead letters cannot be published'
          runbook: 'docker compose ps kafka and docker compose logs kafka; restart with docker compose up -d --wait kafka.'
          __dashboardUid__: ezeebit-alerts
          __panelId__: '15'
