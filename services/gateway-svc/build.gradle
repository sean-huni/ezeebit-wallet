dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webmvc'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
	// Lettuce directly, not spring-boot-starter-data-redis: its health indicator would take the edge out of
	// readiness when Redis is away, and the limiter refuses with 503 in the application instead.
	implementation "com.bucket4j:bucket4j_jdk17-lettuce:${bucket4jVersion}"
	implementation 'io.lettuce:lettuce-core'
}

def served = rootProject.file('services/config-svc/src/main/resources/served')
tasks.withType(Test).configureEach {
	// The route table, filters and limits under test are the ones config-svc serves.
	systemProperty 'spring.config.import', "file:${served}/application.yml,file:${served}/gateway-svc.yml"
	systemProperty 'redis.image', redisImage
	systemProperty 'compose.file', rootProject.file('compose.yaml').absolutePath
	// EdgeAnswersDocumentedTest reads the services' committed public specs.
	systemProperty 'openapi.snapshots', rootProject.file('docs/openapi').absolutePath
	inputs.dir(rootProject.file('docs/openapi')).withPropertyName('openApiSnapshots').withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.file(rootProject.file('compose.yaml')).withPropertyName('composeFile').withPathSensitivity(PathSensitivity.RELATIVE)
	inputs.dir(served).withPropertyName('servedConfig').withPathSensitivity(PathSensitivity.RELATIVE)
}
