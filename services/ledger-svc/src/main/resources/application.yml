server:
  port: ${SERVER_PORT:8081}
  # Loopback unless SERVER_ADDRESS says otherwise: /internal/** moves money and has no authentication.
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: ledger-svc
  config:
    import: "${CONFIG_IMPORT_OPTIONALITY:}configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
  servlet:
    multipart:
      # No endpoint takes multipart. Left on, a multipart Content-Type without a boundary failed the parse as a 500
      # on every route (Schemathesis, 2026-11-05); off, reads ignore it and JSON writes answer 415.
      enabled: false
  grpc:
    server:
      port: ${LEDGER_GRPC_PORT:9081}
      # Loopback by default, like the HTTP port: these calls move money and carry no credential.
      address: ${SERVER_ADDRESS:127.0.0.1}
      keepalive:
        connection:
          # A client re-reads Eureka only when a connection ends: a 30s GOAWAY lets a new replica in within ~30s; 5s grace outlives a 2s attempt.
          max-age: 30s
          grace-period: 5s
eureka:
  instance:
    metadata-map:
      grpcPort: ${spring.grpc.server.port}
springdoc:
  # Sorted keys keep the committed snapshots in docs/openapi stable; responses come from api/doc, not the advice classes.
  writer-with-order-by-keys: true
  override-with-generic-response: false
  default-produces-media-type: application/json
