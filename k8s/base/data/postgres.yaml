apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: 'postgres:18.6-alpine'
          args: ["-c", "max_connections=100"]
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-admin, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-admin, key: POSTGRES_PASSWORD}}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            # Over TCP: initdb's temporary server listens on the socket only, so a socket check is ready before
            # the init script has created the service databases.
            exec:
              command: ["sh", "-c", "pg_isready -h 127.0.0.1 -U \"$POSTGRES_USER\" && psql -h 127.0.0.1 -U ledger -d ledger -c 'SELECT 1' >/dev/null && psql -h 127.0.0.1 -U conversion -d conversion -c 'SELECT 1' >/dev/null"]
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          volumeMounts:
            # Postgres 18 keeps PGDATA under /var/lib/postgresql/18; mounting .../data is a silent no-op.
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
