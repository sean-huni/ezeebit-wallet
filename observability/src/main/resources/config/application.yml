# Compiled into every service (root build.gradle). classpath:/config/ loads beside each service's own application.yml.
management:
  opentelemetry:
    resource-attributes:
      # One series per JVM: without it every replica of a service writes into one Prometheus series. The pid makes a
      # restarted JVM a new series, as a new pod is: one reusing the old labels hides its first counts from rate().
      service.instance.id: ${HOSTNAME:localhost}:${server.port}:${PID:0}
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_URL:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTLP_URL:http://localhost:4318}/v1/logs
  otlp:
    metrics:
      export:
        url: ${OTLP_URL:http://localhost:4318}/v1/metrics
        # Default 1m; the ServiceDown window is a multiple of this step.
        step: 10s
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      # Buckets for p95 panels and for exemplars, which ride on histogram buckets. The ezeebit.* timers come from each
      # service's business spans. Keys match whole dot-separated segments: ezeebit.quote never matches ezeebit.quotes.
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        ezeebit.deposit: true
        ezeebit.ledger.posting: true
        ezeebit.quote: true
        ezeebit.conversion.accept: true
        ezeebit.ratelimit.decision: true
      minimum-expected-value:
        http: 1ms
        ezeebit: 1ms
      maximum-expected-value:
        http: 10s
        ezeebit: 10s
      # An exact 500 ms bucket (le="500.0"): LatencySLOBurn counts requests slower than the SLO against it.
      slo:
        http.server.requests: 500ms
