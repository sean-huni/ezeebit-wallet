dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-api:${springdocVersion}"
	implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'io.grpc:grpc-netty-shaded'
	acceptanceTestImplementation "org.wiremock:wiremock-standalone:${wiremockVersion}"
}

// Spring tests read the same files config-svc serves, so pairs, bands, timeouts and the gateway secret have one home.
def served = rootProject.file('services/config-svc/src/main/resources/served')
tasks.withType(Test).configureEach {
	systemProperty 'spring.config.import', "file:${served}/application.yml,file:${served}/conversion-svc.yml"
	systemProperty 'served.shared', "${served}/application.yml"
}

// The acceptance tier runs the real ledger-svc jar as a separate process: real HTTP, its own database.
def ledgerJar = project(':services:ledger-svc').tasks.named('bootJar').flatMap { it.archiveFile }
tasks.named('acceptanceTest') {
	dependsOn ledgerJar
	inputs.file(ledgerJar)
	// The rate feed in these tests serves the same committed mappings compose mounts into wiremock.
	systemProperty 'rates.stubs', rootProject.file('docker/wiremock').absolutePath
	doFirst {
		systemProperty 'ledger.jar', ledgerJar.get().asFile.absolutePath
	}
	// ./gradlew ... -Dcucumber.filter.name='<regex>' runs only the matching scenarios.
	if (System.getProperty('cucumber.filter.name')) {
		systemProperty 'cucumber.filter.name', System.getProperty('cucumber.filter.name')
	}
}
