# Node image: the default of kind v0.32.0, https://github.com/kubernetes-sigs/kind/releases/tag/v0.32.0
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ezeebit
# The NetworkPolicies name both ranges, so they are pinned rather than left to kind's defaults.
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    extraPortMappings:
      - {containerPort: 30080, hostPort: 8080, listenAddress: "127.0.0.1", protocol: TCP}
      - {containerPort: 30300, hostPort: 3000, listenAddress: "127.0.0.1", protocol: TCP}
