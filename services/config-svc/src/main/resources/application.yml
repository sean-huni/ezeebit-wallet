server:
  port: ${SERVER_PORT:8888}
  # Loopback unless SERVER_ADDRESS says otherwise: /internal/** moves money and has no authentication.
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful
spring:
  # This service does not import the served config, so it repeats the fleet's shutdown budget and threads here.
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # No endpoint takes multipart. Left on, a multipart Content-Type without a boundary failed the parse as a 500
      # on every route (DAST class sweep, 2026-11-05).
      enabled: false
  application:
    name: config-svc
  profiles:
    include: native
  cloud:
    config:
      server:
        native:
          # Not classpath:/config: Spring Boot loads that folder as THIS server's own config.
          search-locations: ${CONFIG_SEARCH_LOCATIONS:classpath:/served}
