# Namespaced Roles in ezeebit-app and ezeebit-data only, never a ClusterRole: ezeebit-obs and Secrets stay unreachable.
# Read and delete only: patch on a Deployment edits a pod template, an indirect path to any Secret in the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-monkey
  namespace: ezeebit-chaos
  labels:
    app.kubernetes.io/name: chaos-monkey
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-monkey
  namespace: ezeebit-app
  labels:
    app.kubernetes.io/name: chaos-monkey
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-monkey
  namespace: ezeebit-app
  labels:
    app.kubernetes.io/name: chaos-monkey
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-monkey
subjects:
  - {kind: ServiceAccount, name: chaos-monkey, namespace: ezeebit-chaos}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-monkey
  namespace: ezeebit-data
  labels:
    app.kubernetes.io/name: chaos-monkey
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-monkey
  namespace: ezeebit-data
  labels:
    app.kubernetes.io/name: chaos-monkey
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chaos-monkey
subjects:
  - {kind: ServiceAccount, name: chaos-monkey, namespace: ezeebit-chaos}
