apiVersion: v1
kind: Service
metadata:
  name: conversion-svc
  labels:
    app.kubernetes.io/name: conversion-svc
    ezeebit.io/stage: app
spec:
  selector:
    app.kubernetes.io/name: conversion-svc
  ports:
    - {name: http, port: 8082, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conversion-svc
  labels:
    app.kubernetes.io/name: conversion-svc
    ezeebit.io/stage: app
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels:
      app.kubernetes.io/name: conversion-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conversion-svc
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: conversion-svc
          image: 'ezeebit/conversion-svc:0.2.0'
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8082}
          env:
            - {name: SERVER_ADDRESS, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: HOSTNAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: OTLP_URL, value: 'http://lgtm.ezeebit-obs:4318'}
            - {name: CONFIG_SERVER_URL, value: 'http://config-svc.ezeebit-app:8888'}
            - {name: EUREKA_URL, value: 'http://eureka-svc.ezeebit-app:8761/eureka/'}
            - {name: DB_URL, value: 'jdbc:postgresql://postgres.ezeebit-data:5432/conversion'}
            - {name: DB_USER, valueFrom: {secretKeyRef: {name: conversion-db, key: DB_USER}}}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: conversion-db, key: DB_PASSWORD}}}
            - {name: RATES_URL, value: 'http://wiremock.ezeebit-app:8080'}
            - {name: KAFKA_BOOTSTRAP, value: 'kafka.ezeebit-data.svc:9092'}
            - {name: GATEWAY_SHARED_SECRET, valueFrom: {secretKeyRef: {name: gateway-proof, key: GATEWAY_SHARED_SECRET}}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          lifecycle:
            # Eureka expiry (15s) plus a client fetch (5s) is when callers stop choosing this pod; until then it keeps
            # serving, and graceful shutdown (20s) then drains what is in flight.
            preStop: {sleep: {seconds: 15}}
