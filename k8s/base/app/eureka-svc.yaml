apiVersion: v1
kind: Service
metadata:
  name: eureka-svc
  labels:
    app.kubernetes.io/name: eureka-svc
    ezeebit.io/stage: app
spec:
  selector:
    app.kubernetes.io/name: eureka-svc
  ports:
    - {name: http, port: 8761, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-svc
  labels:
    app.kubernetes.io/name: eureka-svc
    ezeebit.io/stage: app
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels:
      app.kubernetes.io/name: eureka-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eureka-svc
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: eureka-svc
          image: 'ezeebit/eureka-svc:0.3.0'
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8761}
          env:
            - {name: SERVER_ADDRESS, valueFrom: {fieldRef: {fieldPath: status.podIP}}}
            - {name: HOSTNAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            # Standalone: a peer URL naming this host is dropped as its own, so the server replicates to nobody.
            - {name: EUREKA_INSTANCE_HOSTNAME, value: '$(SERVER_ADDRESS)'}
            - {name: OTLP_URL, value: 'http://lgtm.ezeebit-obs:4318'}
            # The default peer, localhost:8761, is not this host and nothing answers it on a pod-IP bind. JSON, not
            # EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: an environment key binds as defaultzone, which Eureka never reads.
            - name: SPRING_APPLICATION_JSON
              value: '{"eureka":{"client":{"service-url":{"defaultZone":"http://$(SERVER_ADDRESS):8761/eureka/"}}}}'
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          lifecycle:
            # Not in Eureka: these 5s let endpoint removal reach kube-proxy before graceful shutdown (20s) stops accepting.
            preStop: {sleep: {seconds: 5}}
