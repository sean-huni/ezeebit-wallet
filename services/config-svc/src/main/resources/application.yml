server:
  port: ${SERVER_PORT:8888}
  # Loopback unless SERVER_ADDRESS says otherwise: /internal/** moves money and has no authentication.
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: config-svc
  profiles:
    include: native
  cloud:
    config:
      server:
        native:
          # Not classpath:/config: Spring Boot loads that folder as THIS server's own config.
          search-locations: ${CONFIG_SEARCH_LOCATIONS:classpath:/served}
