    <h1>The wallet fleet: five Java services, five containers, one gRPC seam</h1>

      <title id="fleet-architecture-title">Ezeebit wallet fleet, as built</title>
      <desc id="fleet-architecture-desc">Merchants call the gateway, which routes balance reads to ledger-svc and quotes and conversions to conversion-svc over HTTP; conversion-svc posts to the ledger over gRPC with retries and a circuit breaker, records exhausted calls as dead letters on Kafka, and reads rates from WireMock; each service owns a Postgres database, the gateway keeps rate limits in Redis, and every JVM sends telemetry to LGTM, which pages Slack.</desc>
