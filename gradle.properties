springBootVersion=4.1.1
dependencyManagementVersion=1.1.7
# 2025.1.x supports Boot >=4.0.0 and <4.2.0-M1: a Boot 4.2 bump needs a new train.
springCloudVersion=2025.1.3
# Must match the opentelemetry-api of Boot's managed opentelemetry.version (1.62.0 in Boot 4.1.1).
otelLogbackAppenderVersion=2.28.1-alpha
# Latest release on Maven Central (io.cucumber:cucumber-bom maven-metadata.xml), checked 2026-10-13.
cucumberVersion=8.0.4
# Latest stable on Maven Central (org.wiremock:wiremock-standalone; 4.x is still beta), checked 2026-10-13.
wiremockVersion=3.13.2
# Quality tools: latest releases on Maven Central and the Gradle plugin portal (maven-metadata.xml), checked 2026-10-13.
spotbugsPluginVersion=6.5.13
# The analyser is pinned apart from the plugin: Java 25 bytecode (class file 69) needs the 4.10 line.
spotbugsVersion=4.10.5
findsecbugsVersion=1.14.0
checkstyleVersion=14.3.0
jacocoVersion=0.8.15
sonarPluginVersion=7.5.0.8588
