# Ships paused: `k8s/kube.sh chaos on` arms it, `chaos run` fires one Job now while the schedule stays off.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: chaos-monkey
  namespace: ezeebit-chaos
  labels:
    app.kubernetes.io/name: chaos-monkey
spec:
  schedule: "*/10 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  # Without a deadline, `chaos on` runs the slot missed while suspended at once: arming would kill immediately.
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A failed run is reported, never retried: a retry would kill again.
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: chaos-monkey
        spec:
          serviceAccountName: chaos-monkey
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: monkey
              # Alpine, bash and a kubectl of the server's minor. Index digest read with
              # `docker buildx imagetools inspect alpine/k8s:1.36.5` on 2026-10-16 (linux/amd64 and linux/arm64).
              image: 'alpine/k8s:1.36.5@sha256:094adf64cdc4827377cdbe7ea5747472ce115f9fbc64a4e35970ec66777f9a00'
              command: ['bash', '/chaos/monkey.sh', '--victims', '1']
              env:
                - {name: HOME, value: /tmp}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: script, mountPath: /chaos, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap: {name: chaos-monkey}
            - name: tmp
              emptyDir: {}
