# Shared by every config client.
eureka:
  client:
    service-url:
      # One registry and one config server by design: Eureka here is not peer-aware. k8s gates both at replicas 1.
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    # Registers the address the service listens on, so the gateway reaches a loopback-bound instance.
    ip-address: ${SERVER_ADDRESS:127.0.0.1}
    # A killed replica's lease is counted twice by eureka-core, so it leaves the registry about 30s after its
    # last renewal, not the default's 180s.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
server:
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health,info
ezeebit:
  gateway:
    # The gateway adds it to every routed request; ledger-svc and conversion-svc refuse public routes without it.
    # Defence in depth only, not authentication: anyone who can read this file or the environment holds it.
    shared-secret: ${GATEWAY_SHARED_SECRET:local-gateway-proof}
  openapi:
    # The server named in each public spec: where a Swagger UI "Try it out" sends its calls.
    public-url: ${OPENAPI_PUBLIC_URL:http://localhost:8080/api}
